---
# Install the Google Cloud Ops Agent for log collection with metrics turned
# off, mirroring setup-ops-agent.sh. Ops Agent metrics are billed per MiB
# beyond the billing account's 150 MiB/month free tier; Compute Engine's own
# VM metrics stay available for free.

- name: Check for the GCE metadata server
  ansible.builtin.uri:
    url: http://metadata.google.internal/computeMetadata/v1/instance/id
    headers:
      Metadata-Flavor: Google
    timeout: 3
    return_content: false
  register: ops_agent_metadata
  failed_when: false
  changed_when: false
  when: enable_ops_agent | string | lower == 'auto'

- name: Decide whether to manage the Ops Agent
  ansible.builtin.set_fact:
    ops_agent_enabled: >-
      {{ (enable_ops_agent | string | lower in ['true', 'yes', 'y', '1'])
         or (enable_ops_agent | string | lower == 'auto'
             and ops_agent_metadata.status | default(0) == 200) }}

- name: Manage the Ops Agent
  when: ops_agent_enabled | bool
  block:
    - name: Check whether the Ops Agent is installed
      ansible.builtin.command: dpkg -s google-cloud-ops-agent
      register: ops_agent_pkg
      changed_when: false
      failed_when: false

    - name: Install the Ops Agent
      when: ops_agent_pkg.rc != 0
      block:
        - name: Download the Ops Agent repository script
          ansible.builtin.get_url:
            url: https://dl.google.com/cloudagents/add-google-cloud-ops-agent-repo.sh
            dest: /tmp/add-google-cloud-ops-agent-repo.sh
            mode: '0700'

        - name: Add the repository and install the Ops Agent
          ansible.builtin.command: bash /tmp/add-google-cloud-ops-agent-repo.sh --also-install
          register: ops_agent_install
          changed_when: ops_agent_install.rc == 0

      # Same behaviour as the Bash path: a failed agent install must not fail
      # the WordPress deployment.
      rescue:
        - name: Report Ops Agent installation failure
          ansible.builtin.debug:
            msg: >-
              Ops Agent installation failed (this OS release may not be
              supported yet). Continuing without it.

        - name: Mark the Ops Agent as unavailable
          ansible.builtin.set_fact:
            ops_agent_enabled: false

    - name: Write the Ops Agent config (logging on, metrics off)
      ansible.builtin.template:
        src: ops-agent-config.yaml.j2
        dest: /etc/google-cloud-ops-agent/config.yaml
        owner: root
        group: root
        mode: '0644'
        backup: true
      notify: Restart Ops Agent
      when: ops_agent_enabled | bool

    - name: Ensure the Ops Agent is enabled and running
      ansible.builtin.service:
        name: google-cloud-ops-agent
        enabled: true
        state: started
      when: ops_agent_enabled | bool
