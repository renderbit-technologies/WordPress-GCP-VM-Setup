---
- name: Check if swap file exists
  ansible.builtin.stat:
    path: /swapfile
  register: swap_file_check

- name: Create swap file
  ansible.builtin.command: fallocate -l {{ swap_size }} /swapfile
  args:
    creates: /swapfile
  when: not swap_file_check.stat.exists

- name: Set permissions on swap file
  ansible.builtin.file:
    path: /swapfile
    mode: '0600'
    owner: root
    group: root

- name: Check if swap file is already formatted
  ansible.builtin.command: file /swapfile
  register: swap_file_format_check
  changed_when: false
  failed_when: false

- name: Format swap file
  ansible.builtin.command: mkswap /swapfile
  when: "'swap file' not in swap_file_format_check.stdout"

- name: Check if swap is already active
  ansible.builtin.command: swapon --show
  register: swap_active_check
  changed_when: false

- name: Enable swap
  ansible.builtin.command: swapon /swapfile
  when: "'/swapfile' not in swap_active_check.stdout"

- name: Add swap to fstab
  ansible.posix.mount:
    path: none
    src: /swapfile
    fstype: swap
    opts: sw
    passno: 0
    dump: 0
    state: present

- name: Configure vm.swappiness
  ansible.posix.sysctl:
    name: vm.swappiness
    value: '10'
    state: present
    sysctl_file: /etc/sysctl.conf
    reload: true

- name: Configure vm.vfs_cache_pressure
  ansible.posix.sysctl:
    name: vm.vfs_cache_pressure
    value: '50'
    state: present
    sysctl_file: /etc/sysctl.conf
    reload: true
