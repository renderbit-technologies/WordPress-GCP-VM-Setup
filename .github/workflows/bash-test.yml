name: Bash Scripts Test (Vagrant)

on:
  push:
    branches: [main]
    paths:
      - "*.sh"
      - ".github/scripts/**"
      - "tests/bash/**"
      - "tests/vagrant/**"
      - "tests/verify-deployment.sh"
      - ".github/workflows/bash-test.yml"
  pull_request:
    branches: [main]
    paths:
      - "*.sh"
      - ".github/scripts/**"
      - "tests/bash/**"
      - "tests/vagrant/**"
      - "tests/verify-deployment.sh"
      - ".github/workflows/bash-test.yml"
  workflow_dispatch:
  schedule:
    - cron: "15 2 * * *"

jobs:
  vagrant-test:
    # Pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19
    # (actions/runner-images#14748). This job depends on the runner's
    # release: distro VirtualBox (vs. the rmmod kvm_amd step and the
    # bento/ubuntu-* guest additions), the HashiCorp apt suite from
    # `lsb_release -cs`. Unpin once verified on ubuntu-26.04.
    runs-on: ubuntu-24.04
    name: vagrant-test (Ubuntu ${{ matrix.ubuntu }} guest)
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["24.04", "26.04"]
    # Job-level so `vagrant up`, `vagrant provision` and `vagrant ssh` all
    # evaluate the Vagrantfile against the same box.
    env:
      UBUNTU_VERSION: ${{ matrix.ubuntu }}
    permissions:
      contents: read
    timeout-minutes: 75
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache Vagrant boxes
        uses: actions/cache@v6
        with:
          path: ~/.vagrant.d/boxes
          key: ${{ runner.os }}-vagrant-${{ matrix.ubuntu }}-${{ hashFiles('tests/bash/Vagrantfile') }}
          restore-keys: ${{ runner.os }}-vagrant-${{ matrix.ubuntu }}-

      - name: Detect host CPU
        id: cpu
        run: |
          vendor="$(awk -F': ' '/^vendor_id/ {print $2; exit}' /proc/cpuinfo)"
          echo "vendor=${vendor}" >> "$GITHUB_OUTPUT"
          lscpu | grep -E 'Vendor ID|Model name|Hypervisor vendor|Virtualization' || true
          lsmod | grep -E '^kvm' || true

      # A lost runner ("The hosted runner lost communication with the server")
      # keeps no job log, but GitHub still records which steps ran or were
      # skipped, so exactly one of these two marks the host CPU on every run.
      - name: "Host CPU: Intel"
        if: steps.cpu.outputs.vendor == 'GenuineIntel'
        run: "true"

      - name: "Host CPU: AMD"
        if: steps.cpu.outputs.vendor == 'AuthenticAMD'
        run: "true"

      - name: Install VirtualBox
        # Usually ~1m; a slow runner mirror took ~15m on 2026-10-07 while
        # still making progress. 20m still fails a real stall (42m on
        # 2026-08-19) well before the job limit.
        timeout-minutes: 20
        run: |
          sudo apt-get update
          # Removing virtualbox-ext-pack as it requires interactive license acceptance
          sudo apt-get install -y virtualbox

      - name: Install Vagrant
        timeout-minutes: 5
        run: |
          wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update
          sudo apt-get install -y vagrant
          vagrant --version

      - name: Run vagrant up
        # Must exceed attempts x (attempt timeout + 60s kill grace) + retry
        # delay + cleanup (~64m), or this step kills the retry mid-flight.
        # 30m per attempt covers provisioning over slow mirrors (~30m seen
        # for Ansible on 2026-10-07); the job limit leaves room for setup,
        # verify and idempotency on top.
        timeout-minutes: 66
        env:
          VAGRANT_UP_ATTEMPT_TIMEOUT_SECONDS: 1800
        run: |
          # AMD hosts: VirtualBox fails with VERR_SVM_IN_USE while kvm_amd is
          # loaded. Intel hosts: leave kvm_intel alone. With it unloaded, the
          # VirtualBox boot takes the whole runner down ("The hosted runner
          # lost communication with the server", no log); see PR #43. kvm
          # itself stays loaded either way (vboxdrv depends on it).
          sudo rmmod kvm_amd || true
          bash .github/scripts/run-vagrant-up-with-retry.sh tests/bash

      - name: Verify deployment (internal)
        timeout-minutes: 5
        run: |
          cd tests/bash
          # The full verification already runs inside the Vagrant provisioner;
          # re-run it here too as a from-outside-the-provisioner sanity check.
          vagrant ssh -c 'cd /vagrant && sudo env DOMAIN=vagrant.local WP_DB=wp_test WP_DB_USER=wp_user WP_DB_PASS=secure_wp_password bash tests/verify-deployment.sh'

      - name: Idempotency check
        timeout-minutes: 15
        run: |
          cd tests/bash
          vagrant provision
          vagrant ssh -c 'cd /vagrant && sudo env DOMAIN=vagrant.local WP_DB=wp_test WP_DB_USER=wp_user WP_DB_PASS=secure_wp_password bash tests/verify-deployment.sh'
