name: Ansible Playbook Test

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/**"
      - "ansible/**"
      - "tests/verify-deployment.sh"
      - ".github/workflows/ansible-test.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/scripts/**"
      - "ansible/**"
      - "tests/verify-deployment.sh"
      - ".github/workflows/ansible-test.yml"
  schedule:
    - cron: "45 2 * * *"

jobs:
  vagrant-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache Vagrant boxes
        uses: actions/cache@v6
        with:
          path: ~/.vagrant.d/boxes
          key: ${{ runner.os }}-vagrant-${{ hashFiles('ansible/Vagrantfile') }}
          restore-keys: ${{ runner.os }}-vagrant-

      - name: Install VirtualBox
        run: |
          sudo apt-get update
          # Removing virtualbox-ext-pack as it requires interactive license acceptance
          sudo apt-get install -y virtualbox

      - name: Install Vagrant
        run: |
          wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update
          sudo apt-get install -y vagrant
          vagrant --version

      - name: Install Ansible
        run: |
          sudo apt-get install -y ansible
          ansible --version
          ansible-galaxy collection install -r ansible/collections/requirements.yml

      - name: Syntax check
        run: |
          cd ansible
          cp inventory.ini.example inventory.ini
          ansible-playbook playbook.yml --syntax-check

      - name: Run vagrant up
        run: |
          sudo rmmod kvm_amd || true
          sudo rmmod kvm_intel || true
          sudo rmmod kvm || true
          bash .github/scripts/run-vagrant-up-with-retry.sh ansible

      - name: Verify deployment (internal)
        run: |
          cd ansible
          # The full verification already runs inside the Vagrant provisioner;
          # re-run it here too as a from-outside-the-provisioner sanity check.
          vagrant ssh -c 'DOMAIN="192.168.56.10.nip.io" WP_DB="wpdb" WP_DB_USER="wpuser" sudo -E bash /vagrant-tests/verify-deployment.sh'

      - name: Idempotency check
        run: |
          cd ansible
          vagrant provision
          vagrant ssh -c 'DOMAIN="192.168.56.10.nip.io" WP_DB="wpdb" WP_DB_USER="wpuser" sudo -E bash /vagrant-tests/verify-deployment.sh'
